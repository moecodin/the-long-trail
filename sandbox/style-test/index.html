<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Style test: KayKit in a Quaternius meadow</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f2;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  canvas{display:block}
  #ui{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  #ui button{pointer-events:auto;border:0;border-radius:999px;padding:10px 16px;font-size:15px;background:#fffaf0e6;color:#3b2f22;box-shadow:0 2px 8px #0003}
  #ui button.on{background:#f3c96b}
  #label{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#3b2f22;font-size:14px;text-shadow:0 1px 0 #fff8;pointer-events:none}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#3b2f22;font-size:18px}
</style>
</head>
<body>
<div id="loading">Loading the meadow…</div>
<div id="label">Drag to look around. Pinch to zoom.</div>
<div id="ui">
  <button id="next">Next character</button>
  <button id="walk">Walk</button>
  <button id="soft">Soften colors</button>
  <button id="time">Golden hour</button>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
